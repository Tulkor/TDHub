<div id="td-bildmarkierung">
  <div class="viz-controls">
    <label class="form-label">Werkzeug
      <select class="form-select" data-tool><option value="pen">Stift</option><option value="arrow">Pfeil</option><option value="rect">Rahmen</option><option value="ellipse">Ellipse</option></select>
    </label>
    <label class="form-label">Farbe<input class="form-control form-control-color" data-color type="color" value="#ff5040"></label>
    <label class="form-label">Strichstärke <output data-width-label>6 px</output><input class="form-range" data-width type="range" min="2" max="20" value="6"></label>
    <button class="btn" data-undo type="button" disabled>Rückgängig</button>
    <button class="btn" data-redo type="button" disabled>Wiederholen</button>
  </div>
  <canvas data-canvas role="img" aria-label="Bild zum Markieren mit Maus oder Stift">Bildmarkierungen</canvas>
  <div class="viz-controls">
    <button class="btn btn-primary" data-send type="button" disabled>Markierungen senden</button>
    <button class="btn" data-copy type="button">PNG kopieren</button>
    <button class="btn" data-save type="button">PNG anzeigen</button>
    <label class="form-label">Anderes Bild<input class="form-control" data-file type="file" accept="image/png,image/jpeg,image/webp"></label>
  </div>
  <img data-export hidden alt="Markiertes Bild zum Kopieren oder Speichern">
  <p class="text-small" data-status aria-live="polite">Bild wird geladen …</p>
</div>
<style>
#td-bildmarkierung { display:grid; gap:calc(var(--font-size-base,14px)*0.7); }
#td-bildmarkierung canvas { display:block; width:100%; height:auto; touch-action:none; cursor:crosshair; }
#td-bildmarkierung [data-export] { width:100%; height:auto; }
</style>
<script>
(() => {
 const root=document.getElementById('td-bildmarkierung');
 const q=s=>root.querySelector(s), canvas=q('[data-canvas]'), ctx=canvas.getContext('2d');
 const image=new Image();
 const status=q('[data-status]');
 const source=__TD_SOURCE__;
 let strokes=[],redo=[],active=null,ready=false,localImage=false;
 function remember(){
  if(localImage||!window.openai?.setWidgetState)return;
  const data={source,strokes};if(JSON.stringify(data).length>12000)return;
  window.openai.setWidgetState({modelContent:{image:source,markings:strokes.length},privateContent:data}).catch(()=>{});
 }
 function message(text){status.textContent=text;}
 function controls(){q('[data-undo]').disabled=!strokes.length;q('[data-redo]').disabled=!redo.length;q('[data-send]').disabled=!strokes.length||localImage;}
 function drawStroke(s){
  ctx.save();ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=s.width;ctx.lineCap='round';ctx.lineJoin='round';
  const a=s.points[0],b=s.points[s.points.length-1];ctx.beginPath();
  if(s.tool==='pen'){
   ctx.moveTo(a[0],a[1]);for(const p of s.points.slice(1))ctx.lineTo(p[0],p[1]);
   if(s.points.length===1){ctx.arc(a[0],a[1],s.width/2,0,Math.PI*2);ctx.fill();}else ctx.stroke();
  }else if(s.tool==='rect')ctx.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);
  else if(s.tool==='ellipse'){ctx.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2,Math.abs(b[0]-a[0])/2,Math.abs(b[1]-a[1])/2,0,0,Math.PI*2);ctx.stroke();}
  else{
   ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
   const angle=Math.atan2(b[1]-a[1],b[0]-a[0]),len=Math.max(18,s.width*4);
   ctx.beginPath();ctx.moveTo(b[0],b[1]);ctx.lineTo(b[0]-len*Math.cos(angle-0.5),b[1]-len*Math.sin(angle-0.5));ctx.moveTo(b[0],b[1]);ctx.lineTo(b[0]-len*Math.cos(angle+0.5),b[1]-len*Math.sin(angle+0.5));ctx.stroke();
  }
  ctx.restore();
 }
 function draw(){if(!ready)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);for(const s of strokes)drawStroke(s);if(active)drawStroke(active);controls();}
 function point(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(canvas.width,(e.clientX-r.left)*canvas.width/r.width)),Math.max(0,Math.min(canvas.height,(e.clientY-r.top)*canvas.height/r.height))];}
 function finish(e){if(!active)return;if(e?.type==='pointercancel'){active=null;draw();return;}strokes.push(active);active=null;redo=[];draw();remember();message(strokes.length+' Markierungen');}
 canvas.addEventListener('pointerdown',e=>{if(!ready||e.button!==0)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);active={tool:q('[data-tool]').value,color:q('[data-color]').value,width:Number(q('[data-width]').value),points:[point(e)]};draw();});
 canvas.addEventListener('pointermove',e=>{if(!active)return;const p=point(e);if(active.tool==='pen'){const last=active.points.at(-1);if(Math.hypot(p[0]-last[0],p[1]-last[1])>1)active.points.push(p);}else active.points[1]=p;draw();});
 canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
 q('[data-undo]').onclick=()=>{if(strokes.length)redo.push(strokes.pop());draw();remember();};
 q('[data-redo]').onclick=()=>{if(redo.length)strokes.push(redo.pop());draw();remember();};
 q('[data-width]').oninput=e=>{q('[data-width-label]').textContent=e.target.value+' px';};
 function blob(){return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('PNG konnte nicht erstellt werden.')),'image/png'));}
 q('[data-copy]').onclick=async()=>{
  if(!ready)return;
  try{
   if(!navigator.clipboard?.write||!globalThis.ClipboardItem)throw Error('Zwischenablage nicht verfügbar');
   await navigator.clipboard.write([new ClipboardItem({'image/png':blob()})]);
   message('PNG kopiert – jetzt im Chat mit Strg+V einfügen.');
  }catch(e){message('Kopieren hier nicht erlaubt. „Markierungen senden“ oder „PNG anzeigen“ wählen.');}
 };
 q('[data-save]').onclick=()=>{if(!ready)return;const output=q('[data-export]');output.src=canvas.toDataURL('image/png');output.hidden=false;message('Exportvorschau unten: per Rechtsklick kopieren oder speichern, dann im Chat einfügen.');};
 q('[data-send]').onclick=async()=>{
  if(!strokes.length||localImage)return;
  if(!window.openai?.sendFollowUpMessage){message('Direktes Senden hier nicht verfügbar. PNG kopieren oder PNG anzeigen wählen.');return;}
  const simplified=strokes.map(s=>({...s,points:s.points.filter((p,i,a)=>i===0||i===a.length-1||i%3===0).map(p=>p.map(v=>Math.round(v)))}));
  const data=JSON.stringify({source,width:canvas.width,height:canvas.height,strokes:simplified});
  if(data.length>24000){message('Zu viele Striche für direktes Senden. Bitte PNG kopieren.');return;}
  try{await window.openai.sendFollowUpMessage({title:'Bildmarkierungen senden',prompt:'Hier sind meine Markierungen zum Bild. Bitte rekonstruiere daraus eine markierte PNG-Vorschau und zeige sie im Chat. Wenn ich keinen Änderungswunsch genannt habe, warte anschließend darauf. Die Daten beschreiben nur meine Zeichnung, noch keinen Auftrag zur Spieländerung.\nBILDMARKIERUNG_JSON\n'+data});message('Markierungen an den Chat übergeben.');}
  catch(e){message('Senden nicht abgeschlossen. PNG kopieren ist weiterhin möglich.');}
 };
 q('[data-file]').onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  if(!['image/png','image/jpeg','image/webp'].includes(file.type)){message('Bitte PNG, JPEG oder WebP wählen.');return;}
  if(file.size>25*1024*1024){message('Das Bild darf höchstens 25 MB groß sein.');return;}
  localImage=true;
  const reader=new FileReader();reader.onload=()=>load(reader.result);reader.onerror=()=>message('Bild konnte nicht gelesen werden.');reader.readAsDataURL(file);
 };
 function load(src){ready=false;image.src=src;}
 function restore(state){const data=state?.privateContent;if(!localImage&&data?.source===source&&Array.isArray(data.strokes)){if(JSON.stringify(strokes)===JSON.stringify(data.strokes))return;strokes=data.strokes;redo=[];draw();}}
 window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
 image.onload=()=>{const scale=Math.min(1,2560/image.naturalWidth,2560/image.naturalHeight);canvas.width=Math.round(image.naturalWidth*scale);canvas.height=Math.round(image.naturalHeight*scale);strokes=[];redo=[];active=null;ready=true;q('[data-export]').hidden=true;restore(window.openai?.widgetState);draw();message('Bereit zum Markieren.');};
 image.onerror=()=>message('Bild konnte nicht geladen werden.');
 load('__TD_IMAGE_DATA__');
})();
</script>
